# Сборка и публикация игры на GitHub Pages при каждом пуше в main.
#
# dist/ в репозиторий не коммитится: собирается здесь. Звук наоборот лежит
# в репозитории готовыми файлами, ffmpeg нужен только чтобы их перегенерировать.
#
# Ставится всё целиком, без --omit=optional: этим ключом отсекается не только
# ffmpeg, но и нативные бинари rollup и esbuild — они тоже optional, и сборка
# падает с «Cannot find module @rollup/rollup-linux-x64-gnu».

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: свежий пуш отменяет предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
